name: Build and publish nightly APK

on:
  push:
    branches:
      - 'dev'
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle'
      - '.github/workflows/build-nightly.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  build-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Auto-detect, unzip and commit ZIP patches
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          ZIPS=( *.zip patches/*.zip )
          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "No ZIP files found. Proceeding with normal build."
            exit 0
          fi

          echo "Found ZIP file(s): ${ZIPS[*]}"
          for z in "${ZIPS[@]}"; do
            TMP_DIR="$(mktemp -d)"
            unzip -q -o "$z" -d "$TMP_DIR"

            TOP_ITEMS=( "$TMP_DIR"/* )
            SRC_ROOT="$TMP_DIR"
            if [ "${#TOP_ITEMS[@]}" -eq 1 ] && [ -d "${TOP_ITEMS[0]}" ] && [ -d "${TOP_ITEMS[0]}/app" ]; then
              SRC_ROOT="${TOP_ITEMS[0]}"
            fi

            rsync -a --exclude='.github/workflows/' --exclude='.git/' "$SRC_ROOT/" ./
            rm -rf "$TMP_DIR"
            rm -f "$z"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: auto-extract zip patch [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Extracted ZIP and pushed commit."
          else
            echo "No file changes after extracting ZIP."
          fi

      - name: Download native libraries
        env:
          NATIVE_TOKEN: ${{ secrets.ZALOXPOSEDNATIVE_REPO_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f "ZaloXposedNative/arm64-v8a/libZaloXposedNative.so" ]; then
            echo "ZaloXposedNative already exists. Skipping download."
            exit 0
          fi

          if [ -n "$NATIVE_TOKEN" ]; then
            export GH_TOKEN="$NATIVE_TOKEN"
            ASSET_URL="$(gh api \
              repos/ElectroHeavenVN/ZaloXposedNative/releases/tags/lib \
              --jq '.assets[] | select(.name == "Output.zip") | .url')"
            if [ -z "$ASSET_URL" ]; then
              echo "Output.zip not found in release tag lib" >&2
              exit 1
            fi
            gh api "$ASSET_URL" \
              --header 'Accept: application/octet-stream' \
              > "$RUNNER_TEMP/Output.zip"
            unzip -q -o "$RUNNER_TEMP/Output.zip" -d ZaloXposedNative
          else
            echo "ZALOXPOSEDNATIVE_REPO_TOKEN not set. Extracting native libs from latest public ElectroHeavenVN/ZaloXposed release..."
            TMP_APK="$RUNNER_TEMP/upstream_zaloxposed.apk"
            gh release download --repo ElectroHeavenVN/ZaloXposed --pattern "*.apk" --output "$TMP_APK" --clobber
            TMP_EXT="$RUNNER_TEMP/native_ext"
            rm -rf "$TMP_EXT"
            mkdir -p "$TMP_EXT" ZaloXposedNative
            unzip -q -o "$TMP_APK" "lib/*/*.so" -d "$TMP_EXT" || true
            if [ -d "$TMP_EXT/lib" ]; then
              cp -r "$TMP_EXT/lib/"* ZaloXposedNative/
            fi
            rm -rf "$TMP_EXT" "$TMP_APK"
          fi

          if [ ! -f "ZaloXposedNative/arm64-v8a/libZaloXposedNative.so" ]; then
            echo "libZaloXposedNative.so not found" >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"

          if [ -n "$SIGNING_KEYSTORE_BASE64" ] && [ -n "$SIGNING_STORE_PASSWORD" ] && [ -n "$SIGNING_KEY_ALIAS" ] && [ -n "$SIGNING_KEY_PASSWORD" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            STORE_PASS="$SIGNING_STORE_PASSWORD"
            KEY_ALIAS="$SIGNING_KEY_ALIAS"
            KEY_PASS="$SIGNING_KEY_PASSWORD"
          else
            echo "Signing secrets not set. Generating fallback release keystore..."
            STORE_PASS="digitalxiao123"
            KEY_ALIAS="digitalxiao"
            KEY_PASS="digitalxiao123"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=DigitalXiao, OU=Quocdat, O=DigitalXiao, L=Hanoi, S=Hanoi, C=VN"
          fi

          cat > local.properties <<EOF
          signing.storeFile=$KEYSTORE_PATH
          signing.storePassword=$STORE_PASS
          signing.keyAlias=$KEY_ALIAS
          signing.keyPassword=$KEY_PASS
          EOF

      - name: Build signed release APK
        run: |
          chmod +x ./gradlew
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION_CODE=$(git rev-list --count HEAD)
          ./gradlew --no-daemon --stacktrace assembleRelease -x lint \
            -PversionCode="$VERSION_CODE" \
            -PversionName="nightly-${SHORT_SHA}"

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p release
          mapfile -t apks < <(find app/build/outputs/apk/release -type f -name '*.apk' | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "Release APK not found" >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            cp "$apk" "release/ZaloXposed-${apk##*/}"
          done

      - name: Recreate nightly tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin --delete nightly 2>/dev/null || true
          git tag -d nightly 2>/dev/null || true
          git tag nightly HEAD
          git push origin refs/tags/nightly

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly build
          prerelease: true
          generate_release_notes: false
          files: release/*.apk

      - name: Publish APK to Xposed Modules Repo
        env:
          GH_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
          TARGET_REPO: Xposed-Modules-Repo/io.github.electroheavenvn.zaloxposed
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "XPOSED_REPO_TOKEN not set. Skipping Xposed Repo publish."
            exit 0
          fi

          SHORT_SHA="$(git rev-parse --short HEAD)"
          VERSION_NAME="nightly-${SHORT_SHA}"
          VERSION_CODE="$(git rev-list --count HEAD)"

          APK="$(find release -maxdepth 1 -type f -name '*.apk' | sort | head -n1)"
          if [ -z "$APK" ]; then
            echo "Release APK not found" >&2
            exit 1
          fi

          NOTES_FILE="$RUNNER_TEMP/xposed-release-notes.md"
          git log -1 --pretty=format:"Nightly build (%h)%n%n%B" > "$NOTES_FILE"

          gh release list \
            --repo "$TARGET_REPO" \
            --limit 1000 \
            --json tagName,name,isPrerelease \
            --jq '.[] | select(.isPrerelease == true and (((.name // "") | startswith("nightly-")) or ((.name // "") | startswith("Nightly")))) | .tagName' |
            while IFS= read -r old_tag; do
              [ -z "$old_tag" ] || gh release delete "$old_tag" \
                --repo "$TARGET_REPO" \
                --yes \
                --cleanup-tag
            done

          gh release create nightly "$APK" \
            --repo "$TARGET_REPO" \
            --target main \
            --title "$VERSION_NAME" \
            --notes-file "$NOTES_FILE" \
            --prerelease \
            --draft

          gh release edit nightly \
            --repo "$TARGET_REPO" \
            --draft=false \
            --prerelease
